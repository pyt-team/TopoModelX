name: "Testing Tutorials"

on:
  workflow_dispatch:
  push:
    branches: [main,github-actions-test]
    paths-ignore:
    - 'docs/**'
    - 'README.md'
    - 'LICENSE.txt'
    - '.gitignore'

  pull_request:
    branches: [main]
    paths-ignore:
    - 'docs/**'
    - 'README.md'
    - 'LICENSE.txt'
    - '.gitignore'

# Disable debugger's warnings from nbconvert in test_tutorials.py
env:
  PYDEVD_DISABLE_FILE_VALIDATION: 1

jobs:
  simplicial-pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        torch-version: ["2.8.0", "2.12.0"]
        exclude:
          # torch 2.8 has no cp314 wheels
          - python-version: "3.14"
            torch-version: "2.8.0"
        test-group: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install PyTorch ${{ matrix.torch-version }}+cpu
        run: |
          uv venv
          uv pip install torch==${{ matrix.torch-version}} --extra-index-url https://download.pytorch.org/whl/cpu
          uv pip install pyg_lib -f https://data.pyg.org/whl/torch-${{ matrix.torch-version }}+cpu.html

      - name: Install main package
        run: uv pip install -e .[all]

      - name: Run tests for tutorials on simplicial domain [pytest] [Group-${{ matrix.test-group}}]
        run: uv run --no-sync pytest --splits 4 --group ${{ matrix.test-group}} test/tutorials/test_simplicial.py

